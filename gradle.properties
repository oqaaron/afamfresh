# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Tuned down from -Xmx2048m: this machine has 8 GB RAM and a fixed 4 GB pagefile,
# so a 2 GB reservation exceeded the available commit charge and the daemon was
# dying with "Native memory allocation (mmap) failed to map ... G1 virtual space".
# Sized for this machine: 8 GB RAM with a commit limit of only ~12 GB (the
# pagefile is pinned to 2 GB per drive). 1792m consistently overshot the
# available commit once VS Code was resident and the daemon was killed
# mid-build; 1408m fits alongside the IDE and still compiles Compose fine.
#
# If builds start dying with "daemon disappeared", check for orphaned Gradle
# daemons first — a crashed daemon does not clean itself up, and they
# accumulate. `gradlew --stop` clears them.
#
# LOWERED AGAIN, from 1408m, to make `assembleRelease` possible at all.
#
# R8 needs a large NATIVE allocation on top of the Java heap, and at 1408m the
# daemon died every time with:
#
#   Native memory allocation (malloc) failed to allocate 2051648 bytes.
#   Error detail: Chunk::new        (hs_err ... Out of Memory Error arena.cpp)
#
# Note this is native memory, not heap — so raising -Xmx made it WORSE, because
# a bigger reserved heap leaves less address space and commit for the native
# arenas R8 allocates. 2560m and 2048m both failed faster than 1408m did.
# Dropping to 1024m let minifyReleaseWithR8 and shrinkReleaseRes complete.
#
# Debug builds and the unit tests also pass at 1024m, so this is the single
# setting for both. Do not raise it to "fix" a release-build OOM.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8

# Run the Kotlin compiler INSIDE the Gradle daemon instead of forking a second
# JVM for it. Two JVMs at ~1 GB heap each commit more than this machine has
# headroom for; one slightly larger JVM fits.
kotlin.compiler.execution.strategy=in-process

# Limit concurrent worker processes so the build does not fan out into more JVMs.
org.gradle.workers.max=1

# Re-use build outputs between builds so repeat builds do far less work.
org.gradle.caching=true

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true

# Disabled temporarily for build stability (AGP 8.2.2 compatibility issue)
org.gradle.configuration-cache=false

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# ===== ANDROIDX SETTINGS =====
# Enable AndroidX support
android.useAndroidX=true

# Jetifier rewrites legacy support-library bytecode at build time. Every dependency
# in app/build.gradle.kts is already AndroidX, so this was pure build cost (extra
# memory + time) with nothing to convert.
android.enableJetifier=false

# Suppress compileSdk warnings
android.suppressUnsupportedCompileSdk=34
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

