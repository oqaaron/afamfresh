# Cap Gradle JVM heap to 2048M and use the parallel collector to prevent Linux OOM kills
org.gradle.jvmargs=-Xmx2048m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Restrict worker threads to 1 to reduce concurrent memory spikes on resource-constrained devices
org.gradle.workers.max=1

# Disable daemon and parallel execution when memory is limited
org.gradle.daemon=false
org.gradle.parallel=false

# Re-use build outputs between builds
org.gradle.caching=true

# Disabled for build stability
org.gradle.configuration-cache=false

# Reduce Kotlin compiler worker memory footprint
kotlin.daemon.jvm.options=-Xmx1024m
kotlin.code.style=official

# ===== ANDROIDX SETTINGS =====
android.useAndroidX=true
android.enableJetifier=false

# Suppress compileSdk warnings for compileSdk 34 and 36
android.suppressUnsupportedCompileSdk=34,36

android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
