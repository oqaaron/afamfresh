# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Tuned down from -Xmx2048m: this machine has 8 GB RAM and a fixed 4 GB pagefile,
# so a 2 GB reservation exceeded the available commit charge and the daemon was
# dying with "Native memory allocation (mmap) failed to map ... G1 virtual space".
# Sized for this machine: 8 GB RAM with a commit limit of only ~12 GB (the
# pagefile is pinned to 2 GB per drive). 1792m consistently overshot the
# available commit once VS Code was resident and the daemon was killed
# mid-build; 1408m fits alongside the IDE and still compiles Compose fine.
#
# If builds start dying with "daemon disappeared", check for orphaned Gradle
# daemons first — a crashed daemon does not clean itself up, and they
# accumulate. `gradlew --stop` clears them.
org.gradle.jvmargs=-Xmx1408m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8

# Run the Kotlin compiler INSIDE the Gradle daemon instead of forking a second
# JVM for it. Two JVMs at ~1 GB heap each commit more than this machine has
# headroom for; one slightly larger JVM fits.
kotlin.compiler.execution.strategy=in-process

# Limit concurrent worker processes so the build does not fan out into more JVMs.
org.gradle.workers.max=1

# Re-use build outputs between builds so repeat builds do far less work.
org.gradle.caching=true

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true

# Disabled temporarily for build stability (AGP 8.2.2 compatibility issue)
org.gradle.configuration-cache=false

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# ===== ANDROIDX SETTINGS =====
# Enable AndroidX support
android.useAndroidX=true

# Jetifier rewrites legacy support-library bytecode at build time. Every dependency
# in app/build.gradle.kts is already AndroidX, so this was pure build cost (extra
# memory + time) with nothing to convert.
android.enableJetifier=false

# Suppress compileSdk warnings
android.suppressUnsupportedCompileSdk=34
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

