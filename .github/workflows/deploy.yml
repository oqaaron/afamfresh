name: Deploy to Cloud Run

on:
  push:
    branches:
      - main  # or your default branch

env:
  PROJECT_ID: your-gcp-project-id
  SERVICE_NAME: afamfresh-backend
  REGION: us-central1
  IMAGE: gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Needed for workload identity federation (optional)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build Docker image with Google Cloud Build
        run: |
          gcloud builds submit --tag ${{ env.IMAGE }}

      # Every credential the backend needs must be listed here. The PHP
      # config reads them from the environment and no longer carries
      # literal fallbacks, so a key missing from this line does not fall
      # back to a working value — that integration comes up with an empty
      # credential and fails at the first call. Adding a credential to
      # env.yaml means adding it here and as a repository secret too.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --set-env-vars DB_HOST=${{ secrets.DB_HOST }},DB_USER=${{ secrets.DB_USER }},DB_PASS=${{ secrets.DB_PASS }},DB_NAME=${{ secrets.DB_NAME }},PESAPAL_ENV=${{ secrets.PESAPAL_ENV }},PESAPAL_CONSUMER_KEY=${{ secrets.PESAPAL_CONSUMER_KEY }},PESAPAL_CONSUMER_SECRET=${{ secrets.PESAPAL_CONSUMER_SECRET }},PESAPAL_IPN_ID=${{ secrets.PESAPAL_IPN_ID }},PESAPAL_PUBLIC_BASE_URL=${{ secrets.PESAPAL_PUBLIC_BASE_URL }},BREVO_API_KEY=${{ secrets.BREVO_API_KEY }},TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }},TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}