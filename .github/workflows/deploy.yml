name: Deploy backend to Cloud Run

# Manual only for now. The backend actually deploys through Render on every
# push to main; this Cloud Run path was never finished (no repository secrets
# configured), and firing it automatically on every api/** push just produces
# a failed check. Re-add the `push:` trigger above once this is the real
# deploy target and the secrets it checks for actually exist.
on:
  workflow_dispatch:

env:
  SERVICE_NAME: afamfresh-backend
  REGION: europe-west3

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Fail early and by name. Without this the job runs for minutes and then
      # dies inside gcloud with an opaque error, which is how the previous
      # version of this file wasted its time.
      - name: Check required secrets are present
        run: |
          missing=()
          for s in GCP_PROJECT_ID GCP_CREDENTIALS CLOUD_SQL_INSTANCE GCS_BUCKET \
                   GOOGLE_WEB_CLIENT_ID \
                   DB_USER DB_PASS DB_NAME \
                   PESAPAL_CONSUMER_KEY PESAPAL_CONSUMER_SECRET \
                   PESAPAL_IPN_ID PESAPAL_PUBLIC_BASE_URL \
                   BREVO_API_KEY; do
            [ -z "${!s:-}" ] && missing+=("$s")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "All ${#missing[@]} required secrets present."
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          CLOUD_SQL_INSTANCE: ${{ secrets.CLOUD_SQL_INSTANCE }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          PESAPAL_CONSUMER_KEY: ${{ secrets.PESAPAL_CONSUMER_KEY }}
          PESAPAL_CONSUMER_SECRET: ${{ secrets.PESAPAL_CONSUMER_SECRET }}
          PESAPAL_IPN_ID: ${{ secrets.PESAPAL_IPN_ID }}
          PESAPAL_PUBLIC_BASE_URL: ${{ secrets.PESAPAL_PUBLIC_BASE_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # The image tag is built here, in a step, not in the workflow-level env
      # block. `env:` entries cannot reference each other -- the previous
      # version had IMAGE: gcr.io/${{ env.PROJECT_ID }}/... which silently
      # resolved to gcr.io//afamfresh-backend and could never have worked.
      - name: Resolve image tag
        id: img
        run: echo "tag=gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: gcloud builds submit --tag "${{ steps.img.outputs.tag }}" --quiet

      # Credentials go in as secrets, not --set-env-vars: values passed that
      # way are readable by anyone with viewer access to the service. The PHP
      # config reads them from the environment either way.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --image "${{ steps.img.outputs.tag }}" \
            --platform managed \
            --region "${{ env.REGION }}" \
            --allow-unauthenticated \
            --add-cloudsql-instances "${{ secrets.CLOUD_SQL_INSTANCE }}" \
            --set-env-vars "DB_SOCKET=/cloudsql/${{ secrets.CLOUD_SQL_INSTANCE }},GCS_BUCKET=${{ secrets.GCS_BUCKET }},GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }},FIREBASE_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}" \
            --set-secrets "DB_USER=DB_USER:latest,DB_PASS=DB_PASS:latest,DB_NAME=DB_NAME:latest,PESAPAL_ENV=PESAPAL_ENV:latest,PESAPAL_CONSUMER_KEY=PESAPAL_CONSUMER_KEY:latest,PESAPAL_CONSUMER_SECRET=PESAPAL_CONSUMER_SECRET:latest,PESAPAL_IPN_ID=PESAPAL_IPN_ID:latest,PESAPAL_PUBLIC_BASE_URL=PESAPAL_PUBLIC_BASE_URL:latest,BREVO_API_KEY=BREVO_API_KEY:latest,FIREBASE_CREDENTIALS_JSON=FIREBASE_CREDENTIALS_JSON:latest" \
            --quiet

      # A green deploy that serves 500s is worse than a red one, because
      # nobody looks again. Hit a real endpoint that touches the database.
      - name: Smoke-test the deployment
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
                  --region "${{ env.REGION }}" --format='value(status.url)')
          echo "Deployed to $URL"
          code=$(curl -s -o /tmp/body -w '%{http_code}' "$URL/api/products.php?action=list")
          echo "GET /api/products.php?action=list -> $code"
          head -c 400 /tmp/body; echo
          [ "$code" = "200" ] || { echo "::error::Smoke test failed ($code)"; exit 1; }
